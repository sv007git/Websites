<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f43f5e" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#090a0f"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#shGradient)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="160" fill="#0f111a" opacity="0.6"/>
  <!-- 9:16 vertical phone outline -->
  <rect x="196" y="146" width="120" height="220" rx="20" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.4"/>
  <!-- Play triangle in center -->
  <polygon points="230,200 310,256 230,312" fill="url(#playGrad)"/>
</svg>
