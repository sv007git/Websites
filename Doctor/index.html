<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor — Holistic Medical Anatomy & Disease Intelligence</title>
  <meta name="description" content="Interactive Black & White holistic medical dashboard featuring Baby, Man, and Woman anatomy (Internals & Externals), with Top 10 diseases per organ, Allopathy, Ayurveda, Mudras, Yoga, Nutrition, and English Voice Narration.">
  <meta name="keywords" content="holistic doctor, medical anatomy, baby man woman, internals externals, top 10 diseases, ayurveda, mudras, yoga asanas, pranayama, vitamins deficiencies, allopathy medicines">
  <meta name="author" content="sv007git">
  <meta name="theme-color" content="#000000">

  <!-- Open Graph / Meta -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Doctor — Holistic Medical Anatomy & Disease Intelligence">
  <meta property="og:description" content="Explore interactive human anatomy with top 10 diseases per body part across Baby, Man, and Woman with voice narration and holistic protocols.">
  <meta property="og:url" content="https://sv007git.github.io/Doctor/">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Header / Navigation Bar -->
  <header class="site-header" role="banner">
    <div class="header-container">
      <!-- Brand Section -->
      <div class="brand-section">
        <div class="brand-logo" aria-hidden="true">✚</div>
        <div class="brand-title">
          <span>DOCTOR</span>
          <span class="brand-tag">HOLISTIC v1.0</span>
        </div>
      </div>

      <!-- Controls: Demographics & Layers -->
      <div class="header-controls">
        <!-- Demographic Switcher -->
        <div class="switcher-group" role="group" aria-label="Demographic Selection">
          <button class="switcher-btn is-active" data-demographic="man" title="Adult Male Anatomy">
            <span>👨</span> Man
          </button>
          <button class="switcher-btn" data-demographic="woman" title="Adult Female Anatomy">
            <span>👩</span> Woman
          </button>
          <button class="switcher-btn" data-demographic="baby" title="Pediatric / Infant Anatomy">
            <span>👶</span> Baby
          </button>
        </div>

        <!-- Layer Switcher -->
        <div class="switcher-group" role="group" aria-label="Anatomical Layer Selection">
          <button class="switcher-btn is-active" data-layer="internals" title="Visceral & Vital Organ Systems">
            <span>🩻</span> Internals
          </button>
          <button class="switcher-btn" data-layer="externals" title="Surface, Sensory & Musculoskeletal Systems">
            <span>👤</span> Externals
          </button>
        </div>
      </div>

      <!-- Actions: Theme Toggle & GitHub Repo -->
      <div class="header-actions">
        <button class="action-btn" id="theme-toggle-btn" title="Toggle Light/Dark Theme (Press T)">
          <span class="icon">☀️</span> Light Mode
        </button>
        <a 
          href="https://github.com/sv007git/Doctor" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="action-btn repo-link"
          title="View GitHub Repository"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          sv007git/Doctor
        </a>
      </div>
    </div>
  </header>

  <!-- Main App Layout: Two Columns -->
  <main class="app-container" role="main">
    <!-- Left Column: Interactive Vector Anatomy Canvas -->
    <section class="anatomy-panel" aria-label="Interactive Anatomy Viewer">
      <!-- Panel Header & Viewport Controls -->
      <div class="panel-header">
        <div class="panel-title-area">
          <span class="panel-title">Interactive Anatomy</span>
          <div class="panel-badges">
            <span class="status-badge" id="canvas-status-badge">Click Organ</span>
          </div>
        </div>

        <div class="viewport-toolbar" role="toolbar" aria-label="Zoom and Viewport Controls">
          <button class="tool-btn" id="zoom-out-btn" title="Zoom Out (−)">−</button>
          <span class="zoom-indicator" id="zoom-level-display">100%</span>
          <button class="tool-btn" id="zoom-in-btn" title="Zoom In (+)">+</button>
          <button class="tool-btn" id="zoom-reset-btn" title="Reset Zoom View (100%)">↺</button>
        </div>
      </div>

      <!-- SVG Viewport Area -->
      <div class="anatomy-viewport" id="anatomy-canvas-container" tabindex="0" aria-label="Vector Anatomical Diagram">
        <!-- SVG will be dynamically injected by js/anatomy-svg.js -->
      </div>

      <!-- Viewport Footer Tips & Keyboard Shortcuts -->
      <div class="viewport-footer">
        <span>Hover cursor &bull; Click to inspect Top 10 conditions</span>
        <span><kbd>T</kbd> Theme &bull; <kbd>Space</kbd> Audio &bull; <kbd>Esc</kbd> Reset</span>
      </div>

      <!-- Floating Tooltip -->
      <div class="anatomy-tooltip" id="anatomy-tooltip" role="tooltip" aria-hidden="true"></div>
    </section>

    <!-- Right Column: Holistic Disease Browser & Protocol Details -->
    <section class="content-panel" id="content-panel" aria-label="Disease Intelligence & Holistic Protocols">
      <!-- Universal Search & Filter Bar -->
      <div class="search-filter-bar">
        <div class="search-input-wrapper">
          <span style="font-size: 1rem; color: var(--text-muted);" aria-hidden="true">🔍</span>
          <input 
            type="text" 
            class="search-input" 
            id="disease-search-input" 
            placeholder="Search all diseases, causes, ayurvedic herbs, mudras, yoga, vitamins..."
            aria-label="Search conditions and holistic remedies"
          >
          <button class="search-clear-btn" id="search-clear-btn" title="Clear Search (Esc)">Clear</button>
        </div>
      </div>

      <!-- Active Part Overview Card -->
      <div class="part-overview-card" id="part-overview-card" aria-live="polite">
        <!-- Overview injected dynamically by js/app.js -->
      </div>

      <!-- Top 10 Diseases Section -->
      <section class="diseases-section" aria-label="Top 10 Diseases List">
        <div class="section-header">
          <h2 class="section-title">
            <span>📋</span> Top 10 Pathologies & Conditions
          </h2>
          <span class="section-badge" id="diseases-count-badge">10 Conditions</span>
        </div>

        <div class="diseases-grid" id="top-diseases-grid">
          <!-- Disease Cards injected dynamically by js/app.js -->
        </div>
      </section>

      <!-- Holistic Deep-Dive Protocol Modal / Container -->
      <section id="holistic-protocol-container" aria-label="Comprehensive Holistic Protocol" aria-live="polite">
        <!-- Deep-dive 8-column protocol injected dynamically by js/app.js -->
      </section>
    </section>
  </main>

  <!-- Sticky English Audio Controller Bar -->
  <footer class="audio-controller-bar" id="audio-controller-bar" role="region" aria-label="English Voice Audio Controller">
    <div class="audio-info">
      <!-- Live Waveform Animation -->
      <div class="audio-visualizer-wave" id="audio-visualizer" aria-hidden="true">
        <span class="wave-bar"></span>
        <span class="wave-bar"></span>
        <span class="wave-bar"></span>
        <span class="wave-bar"></span>
        <span class="wave-bar"></span>
        <span class="wave-bar"></span>
      </div>
      <div>
        <div style="font-size: 0.65rem; font-family: var(--font-mono); color: var(--text-muted); text-transform: uppercase;">
          English Voice Narration
        </div>
        <div class="audio-now-playing" id="audio-now-playing-title">Ready to Read Aloud</div>
      </div>
    </div>

    <!-- Playback Controls -->
    <div class="audio-buttons">
      <button class="audio-play-btn" id="global-audio-play-btn" title="Read Aloud in English (Spacebar)">
        <span>🔊</span> Read Aloud
      </button>
      <button class="action-btn" id="global-audio-stop-btn" title="Stop Audio Narration">
        <span>⏹</span> Stop
      </button>
      <button class="action-btn" id="auto-speak-toggle-btn" title="Toggle Auto-Speak on Organ / Disease Click">
        <span>⚡</span> Auto-Narration
      </button>
    </div>

    <!-- Audio Settings -->
    <div class="audio-settings">
      <label for="audio-rate-select" style="color: var(--text-muted);">Speed:</label>
      <select class="audio-select" id="audio-rate-select" aria-label="Speech Narration Speed">
        <option value="0.8">0.8x (Gentle)</option>
        <option value="1.0" selected>1.0x (Normal)</option>
        <option value="1.15">1.15x (Brisk)</option>
        <option value="1.3">1.3x (Fast)</option>
      </select>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/anatomy-svg.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
