<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing background effect -->
  <rect x="8" y="14" width="84" height="60" rx="16" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- Main Monitor / Screen Frame -->
  <rect x="12" y="16" width="76" height="52" rx="12" fill="#0f172a" stroke="url(#brandGrad)" stroke-width="4" />

  <!-- Inner Display Area -->
  <rect x="18" y="22" width="64" height="40" rx="8" fill="#1e293b" />

  <!-- Share Wave / Arrow Pulse inside Screen -->
  <path d="M40 34 L56 42 L40 50 Z" fill="url(#brandGrad)" />
  <circle cx="56" cy="42" r="5" fill="#38bdf8" />
  <circle cx="36" cy="32" r="3.5" fill="#818cf8" />
  <circle cx="36" cy="52" r="3.5" fill="#818cf8" />
  <line x1="36" y1="32" x2="56" y2="42" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="2 2" />
  <line x1="36" y1="52" x2="56" y2="42" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="2 2" />

  <!-- Stand & Base -->
  <path d="M46 68 L44 80 L56 80 L54 68 Z" fill="url(#brandGrad)" />
  <rect x="34" y="80" width="32" height="4" rx="2" fill="url(#brandGrad)" />

  <!-- Live Broadcast Dot -->
  <circle cx="78" cy="24" r="3" fill="#10b981" />
</svg>
